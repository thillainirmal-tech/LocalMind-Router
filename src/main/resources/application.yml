spring:
  application:
    name: localmind-router
localmind:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:2s}
    read-timeout: ${OLLAMA_READ_TIMEOUT:90s}
server:
  port: ${PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
